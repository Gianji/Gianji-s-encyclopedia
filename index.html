<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafbf9">
  <meta name="description" content="ENCICLOPEDIA — Enciclopedie documentate e interconnesse, pronte da consultare.">
  <title>ENCICLOPEDIA — La tua biblioteca</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigazione principale">
      <a class="brand" href="#/" aria-label="ENCICLOPEDIA, torna alla biblioteca">
        <span class="brand-mark">E<span class="brand-dot">.</span></span>
        <span class="brand-lines"><strong>ENCICLOPEDIA</strong><small>Biblioteca di conoscenza</small></span>
      </a>
      <div class="sidebar-section-label">LA TUA BIBLIOTECA</div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Enciclopedie"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-footer"><div class="storage-note">Biblioteca pubblicata su GitHub</div></div>
    </aside>
    <div class="mobile-shade" id="mobile-shade" hidden></div>
    <div class="work-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu-button" type="button" data-action="toggle-sidebar" aria-label="Apri navigazione" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
          <div class="breadcrumb" id="breadcrumb" aria-label="Percorso di navigazione"></div>
        </div>
        <div class="topbar-actions">
          <button type="button" id="search-trigger" class="search-trigger" data-action="open-search" aria-label="Cerca nelle enciclopedie"><span data-icon="search"></span><span class="search-placeholder">Cerca nelle voci...</span><kbd>⌘ K</kbd></button>
        </div>
      </header>
      <main id="main" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="psicologia-data.js" defer></script>
  <script src="contenuti.js" defer></script>
  <script src="psicologia-storia-estesa.js" defer></script>
  <script src="psicologia-storia-antichita-globale.js" defer></script>
  <script src="psicologia-storia-greco-romana.js" defer></script>
  <script src="psicologia-storia-medievale.js" defer></script>
  <script src="psicologia-storia-eta-moderna.js" defer></script>
  <script src="psicologia-storia-ottocento.js" defer></script>
  <script src="psicologia-origini.js" defer></script>
  <script src="psicologia-introduzione.js" defer></script>
  <script src="fonti-psicologia.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
